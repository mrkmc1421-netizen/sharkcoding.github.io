<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SharkMod Sign In 🦈</title>
  <link rel="stylesheet" href="css/shark-style.css">
</head>

<body class="ocean-bg">

  <div class="auth-box">
    <h1>🦈 Sign In</h1>
    <p>Welcome back to the ocean.</p>

    <input id="username" placeholder="Ocean Name">
    <input id="password" type="password" placeholder="Secret Tide">

    <button onclick="signin()">Dive In</button>

    <p>
      New shark?  
      <a href="jumpinwater.html">Jump in Water</a>
    </p>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
